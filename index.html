<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>The Bombay Coalition · Song Bank</title>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&amp;family=DM+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#020d22;--card:#08183a;--ink:#f1ead6;--mut:#8f9ab3;--ac:#d9b55f;--on:#020d22;--gold:#f0d68a;--ln:#172b52;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
header{max-width:1100px;margin:auto;padding:36px 24px 20px;display:flex;align-items:center;gap:20px}
.logo{width:92px;height:92px;border-radius:50%;flex:none;display:block}
h1{font:400 clamp(30px,5vw,46px)/1.05 "Poiret One",Georgia,serif;margin:0;color:var(--ac);letter-spacing:.08em;text-transform:uppercase;-webkit-text-stroke:.6px var(--ac)}
h1 span{display:block;font:400 14px "DM Sans",sans-serif;color:var(--mut);margin-top:8px;letter-spacing:.01em;text-transform:none;-webkit-text-stroke:0}
main{max-width:1100px;margin:auto;padding:0 24px 80px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:40px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr;gap:28px}header{padding-top:24px}.logo{width:72px;height:72px}}
input,select,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;padding:11px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--card)}
input::placeholder,textarea::placeholder{color:var(--mut)}
button{cursor:pointer;border:1px solid var(--ln);background:transparent;border-radius:8px;padding:7px 12px}
button:hover{border-color:var(--ac)}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
.chips button{border-radius:99px;padding:5px 14px;font-size:14px;color:var(--mut)}
.chips button[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.chips small{opacity:.6;margin-left:6px}
h2{font:600 13px "DM Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);margin:32px 0 6px}
.row{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row>details{flex:1;min-width:0}.row summary{cursor:pointer;padding:3px 0}
.row .n{flex:1;min-width:0}
.row .tr{color:var(--mut);font-size:14px;margin:2px 0 8px;line-height:1.6}
.tag{font-size:12px;color:var(--mut);margin-left:10px}
.add{width:30px;height:30px;padding:0;border-radius:50%;font-size:18px;line-height:1;flex:none;color:var(--ac);border-color:var(--ln)}
.add.on{background:var(--gold);border-color:var(--gold);color:#020d22}
#pl{position:sticky;top:16px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:20px}
#pl h2{margin:0 0 12px}
#pl ol{padding-left:20px;margin:14px 0}#pl li{padding:5px 0;border-bottom:1px solid var(--ln)}
#pl li div{display:flex;gap:2px;align-items:center}#pl li span{flex:1;font-size:15px}
#pl .mt{display:block;color:var(--mut);font-size:13px;line-height:1.5;margin:2px 0 2px 0}#pl li button{padding:0 7px;font-size:13px;border:0;color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap}.mut{color:var(--mut);font-size:14px}
#adm{background:var(--card);border:1px solid var(--ac);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:none;gap:10px;flex-wrap:wrap;align-items:center}
dialog{border:1px solid var(--ln);border-radius:16px;background:var(--card);color:var(--ink);width:min(440px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog label{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
@media print{body{background:#fff;color:#000}header,#left,.chips,.add,#adm,#pl .bar,#pl li button,#pl .mut{display:none!important}main{display:block;padding:0 0 0 28px;max-width:none}#pl{border:0;position:static;background:none;padding:0;overflow:visible}#pl ol{padding-left:36px;margin:12px 0;list-style-position:outside}#pl h2{color:#000}#pl input{border:0;background:none;color:#000;font:600 22px Georgia,serif;padding:0 0 8px}#pl li{border-color:#ccc;color:#000}#pl .mt{color:#444;font-size:12px}}
</style></head><body>

<script id="app">
const SRC=document.documentElement.cloneNode(true),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D=JSON.parse($('d').textContent);let uid=0;
let items=D.items?D.items.map(i=>({...i,id:++uid})):[
 ...Object.entries(D.s).flatMap(([g,a])=>a.map(n=>({id:++uid,g,n}))),
 ...Object.entries(D.m).flatMap(([g,a])=>a.map(s=>{let[n,t]=s.split('|');t=t?t.split(';'):n.split(/\s*(?:\/|\sx\s)\s*/i);return{id:++uid,g,n,t}}))];
const key=i=>i.g+'|'+i.n;
let cat='All',q='',admin=false,art=null,dirty=false,editId=null,P={name:'',keys:[]};
try{P=JSON.parse(localStorage.getItem('bc_pl'))||P}catch(e){}
const savePL=()=>{try{localStorage.setItem('bc_pl',JSON.stringify(P))}catch(e){}};
const cats=()=>[...new Set(items.map(i=>i.g))];
function nav(){const c=cats();$('nav').innerHTML=['All',...c].map(x=>`<button aria-pressed="${x==cat}" data-c="${esc(x)}">${esc(x)}<small>${x=='All'?items.length:items.filter(i=>i.g==x).length}</small></button>`).join('');$('gl').innerHTML=c.map(x=>`<option value="${esc(x)}">`).join('')}
function list(){const s=q.toLowerCase();let h='',last='';
 items.filter(i=>(cat=='All'||i.g==cat)&&(!s||(i.n+' '+(i.t||[]).join(' ')).toLowerCase().includes(s))).sort((a,b)=>cats().indexOf(a.g)-cats().indexOf(b.g)).forEach(i=>{
  if(i.g!=last&&cat=='All'){h+=`<h2>${esc(i.g)}</h2>`;last=i.g}
  const on=P.keys.includes(key(i));
  h+=`<div class="row"><button class="add${on?' on':''}" data-a="${i.id}" aria-label="${on?'Remove from':'Add to'} playlist: ${esc(i.n)}">${on?'✓':'+'}</button>`+
  (i.t?`<details><summary>${esc(i.n)}<span class="tag">${i.t.length} tracks</span></summary><p class="tr">${i.t.map(esc).join(' → ')}</p></details>`:`<span class="n">${esc(i.n)}</span>`)+
  (admin?`<button data-e="${i.id}">Edit</button><button data-x="${i.id}" aria-label="Delete ${esc(i.n)}">Delete</button>`:'')+`</div>`});
 $('list').innerHTML=h||'<p class="mut">Nothing matches. Try a shorter search or another category.</p>'}
function pl(){const by=Object.fromEntries(items.map(i=>[key(i),i]));
 $('pi').innerHTML=P.keys.map((k,x)=>`<li><div><span>${esc(by[k]?by[k].n:k.split('|')[1])}</span><button data-u="${x}" aria-label="Move up">↑</button><button data-d="${x}" aria-label="Move down">↓</button><button data-r="${x}" aria-label="Remove">✕</button></div>${by[k]&&by[k].t?`<small class="mt">${by[k].t.map(esc).join(' → ')}</small>`:''}</li>`).join('');
 $('pc').textContent=P.keys.length?P.keys.length+' items in your playlist':'Tap + next to any song or medley to start your playlist.';$('pn').value=P.name}
const all=()=>{nav();list();pl();savePL()};
const txt=()=>(P.name||'Playlist')+'\n'+P.keys.map((k,x)=>(x+1)+'. '+k.split('|')[1]).join('\n');
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.c){cat=d.c;all()}
 else if(d.a){const i=items.find(x=>x.id==d.a),k=key(i),x=P.keys.indexOf(k);x<0?P.keys.push(k):P.keys.splice(x,1);all()}
 else if(d.r){P.keys.splice(+d.r,1);all()}
 else if(d.u||d.d){const x=+(d.u||d.d),y=d.u?x-1:x+1;if(y>=0&&y<P.keys.length){[P.keys[x],P.keys[y]]=[P.keys[y],P.keys[x]];all()}}
 else if(d.e){editId=+d.e;const i=items.find(x=>x.id==editId);$('en').value=i.n;$('eg').value=i.g;$('et2').value=(i.t||[]).join('\n');$('ed').showModal()}
 else if(d.x){const i=items.find(x=>x.id==d.x);if(confirm('Delete "'+i.n+'" from the song bank?')){items=items.filter(x=>x!=i);mark()}}
 else if(b.id=='new'){editId=null;['en','eg','et2'].forEach(x=>$(x).value='');$('ed').showModal()}
 else if(b.id=='ec')$('ed').close();
 else if(b.id=='es'){const n=$('en').value.trim(),g=$('eg').value.trim();if(!n||!g){$('en').focus();return}
  const t=$('et2').value.split('\n').map(x=>x.trim()).filter(Boolean),o={n,g};if(t.length)o.t=t;
  if(editId){const i=items.find(x=>x.id==editId);if(key(i)!=g+'|'+n)P.keys=P.keys.map(k=>k==key(i)?g+'|'+n:k);Object.assign(i,{n,g,t:o.t})}else items.push({...o,id:++uid});
  $('ed').close();mark()}
 else if(b.id=='pub')save();
 else if(b.id=='pr')printList(b);

 else if(b.id=='cp'){navigator.clipboard.writeText(txt()).then(()=>b.textContent='Copied!',()=>b.textContent='Copy blocked, use Print').finally(()=>setTimeout(()=>b.textContent='Copy list',2000))}});

async function printList(b){
 if(!P.keys.length){b.textContent='Add songs first';setTimeout(()=>b.textContent='Print / Save',2000);return}
 const by=Object.fromEntries(items.map(i=>[key(i),i]));
 const li=P.keys.map(k=>{const i=by[k];const t=i&&i.t?'<small>'+i.t.map(esc).join(' &rarr; ')+'</small>':'';return '<li>'+esc(i?i.n:k.split('|')[1])+t+'</li>'}).join('');
 const doc='<!doctype html><html><head><meta charset="utf-8"><title>'+esc(P.name||'Playlist')+'</title><style>body{font:16px/1.5 Georgia,serif;max-width:640px;margin:40px auto;padding:0 20px;color:#111}h1{font-size:26px;margin:0 0 4px}p{margin:0 0 20px;color:#555}ol{padding-left:26px}li{padding:6px 0;border-bottom:1px solid #ddd}small{display:block;color:#666;font-size:13px}</style></head><body><h1>'+esc(P.name||'Playlist')+'</h1><p>The Bombay Coalition</p><ol>'+li+'</ol><script>onload=function(){setTimeout(function(){print()},400)}<\/script></body></html>';
 try{const dl=await claude.use('downloads');if(!dl)throw 0;await dl.save({filename:(P.name||'playlist').replace(/[^\w -]+/g,'').trim()+'.html',data:new Blob([doc],{type:'text/html'})});b.textContent='Saved. Open it to print'}
 catch(e){if(e&&e.code=='declined')b.textContent='Print / Save';else{try{print()}catch(_){}b.textContent='Print / Save'}}
 setTimeout(()=>b.textContent='Print / Save',3500)}
function mark(){dirty=true;$('pub').disabled=false;$('st').textContent='Unpublished changes';all()}
async function save(){if(!art)return;$('st').textContent='Publishing…';
 const data=JSON.stringify({items:items.map(({g,n,t})=>t?{g,n,t}:{g,n})}).replace(/</g,'\\u003c');
 const c=SRC.cloneNode(true);c.querySelector('#d').textContent=data;
 c.querySelectorAll('script').forEach(x=>{if(x.id!='d'&&x.id!='app')x.remove()});
 c.querySelectorAll('[artifact-sync]').forEach(x=>x.removeAttribute('artifact-sync'));
 const RESET=':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
 const html='<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+c.body.innerHTML+'</body></html>';
 try{await art.publish(html)}catch(e){$('st').textContent=e.code=='not_writer'?'You do not have edit access to this page':'Could not publish ('+(e.code||e.message)+'). Your changes are still on screen.'}}
all();
(async()=>{try{const u=await claude.use('user');art=await claude.use('artifact');

</script></body></html>
